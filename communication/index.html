<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金沙遗址博物馆传播专题平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="金沙遗址博物馆传播专题 32 比 9 大屏">
      <div class="ambient"></div>
      <header class="topbar">
        <div class="weather-strip">
          <div class="weather-item">
            <span class="weather-icon">传</span>
            <strong>6</strong>
            <span>平台接入</span>
          </div>
          <div class="weather-item">
            <span class="weather-icon">热</span>
            <strong>TOP5</strong>
            <span>话题监测</span>
          </div>
        </div>
        <h1>金沙遗址博物馆传播专题平台</h1>
        <div class="clock-strip">
          <span id="dateText">2026年7月6日</span>
          <strong id="timeText">14:22:00</strong>
        </div>
      </header>

      <section class="center-scene">
        <img src="../assets/ruins-panorama.png" alt="金沙遗址馆传播数字孪生区域" />
        <div class="scene-vignette"></div>
        <div class="media-orbit orbit-a"></div>
        <div class="media-orbit orbit-b"></div>
        <div class="media-node node-web"><span>官网</span><strong>42.8万点击</strong></div>
        <div class="media-node node-social"><span>社媒声量</span><strong>18.6万提及</strong></div>
        <div class="media-node node-topic"><span>热门话题</span><strong>5 个高热</strong></div>
        <div class="center-caption">
          <span>数字孪生传播区</span>
          <strong>平台互动 · 粉丝画像 · 热点报道 · 舆情预警</strong>
        </div>
      </section>

      <aside class="left-stack">
        <article class="panel attention-panel">
          <div class="panel-title"><span>媒体关注情况</span></div>
          <div class="metric-row">
            <div><span>累计关注</span><strong>128.6万</strong><em>六平台汇总</em></div>
            <div><span>浏览量</span><strong>486.2万</strong><em>本月 +18%</em></div>
            <div><span>互动量</span><strong>72.4万</strong><em>赞评藏转</em></div>
            <div><span>媒体报道</span><strong>156</strong><em>年度重点</em></div>
          </div>
          <div class="platform-body">
            <div id="platformBar" class="chart"></div>
            <div class="platform-list" id="platformList"></div>
          </div>
        </article>

        <article class="panel topic-panel">
          <div class="panel-title"><span>热门话题 TOP5</span></div>
          <div class="topic-list" id="topicList"></div>
          <div class="report-list" id="reportList"></div>
        </article>

        <article class="panel audience-panel">
          <div class="panel-title"><span>粉丝画像</span></div>
          <div class="audience-grid">
            <div id="agePie" class="chart"></div>
            <div>
              <div class="sub-title">地域分布</div>
              <div class="mini-bars" id="regionBars"></div>
            </div>
            <div>
              <div class="sub-title">兴趣标签</div>
              <div class="tag-cloud" id="interestTags"></div>
            </div>
          </div>
        </article>
      </aside>

      <aside class="right-stack">
        <article class="panel sentiment-panel">
          <div class="panel-title"><span>舆情监测</span></div>
          <div class="sentiment-head">
            <div><span>社媒提及量</span><strong>18.6万</strong><em>本月 +11%</em></div>
            <div><span>负面占比</span><strong>2.4%</strong><em>可控</em></div>
            <div><span>预警事件</span><strong>3</strong><em>处理中 1</em></div>
          </div>
          <div class="sentiment-body">
            <div id="sentimentPie" class="chart"></div>
            <div class="risk-list" id="riskList"></div>
          </div>
        </article>

        <article class="panel campaign-panel">
          <div class="panel-title"><span>年度宣传热点台账</span></div>
          <div class="campaign-list" id="campaignList"></div>
        </article>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
